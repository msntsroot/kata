assinatura = "def resolver(b: int, e: int, m: int) -> int"
enunciado = """
`(b ^ e) % m`, com `e` até um bilhão. Sem `**` em `b ** e`, sem `pow`.
Multiplicar `e` vezes não termina a tempo.
"""
exemplos = [
  { entrada = [2, 10, 1000] },
  { entrada = [3, 0, 7] },
]
