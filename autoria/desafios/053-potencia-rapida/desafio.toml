  [2, 999999999, 13],
]
dicas = [
  "`b^10 = (b^5)²`. E `b^5 = b × b^4`.",
  "Expoente par: calcule a metade uma vez e eleve ao quadrado. Ímpar: tire um `b`.",
  "Faça `% m` depois de cada multiplicação para os números não explodirem.",
]
referencias = [
  { titulo = "Exponenciação por quadrados (Wikipedia)", url = "https://en.wikipedia.org/wiki/Exponentiation_by_squaring" },
]
conceito = """
Dividir o expoente por 2 a cada passo: um bilhão vira ~30 passos. É O(log e).
"Dividir o problema ao meio" é a mesma ideia da busca binária e do merge sort (arco 7). Criptografia (RSA) depende disto.
"""
