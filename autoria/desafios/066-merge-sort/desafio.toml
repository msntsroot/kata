  { titulo = "Merge sort (Wikipédia)", url = "https://pt.wikipedia.org/wiki/Merge_sort" },
]
conceito = """
Dividir e conquistar: log n níveis de divisão × n de trabalho por nível = O(n log n).
Bubble com 50 mil números faria 2,5 bilhões de comparações; merge sort, menos de 1 milhão.
"""
